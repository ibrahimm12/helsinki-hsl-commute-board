name: Deploy to Azure Container Apps

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_USE_CLI: 'false'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_app_name: ${{ vars.AZURE_APP_NAME }}
      TF_VAR_container_image: ghcr.io/ibrahimm12/helsinki-hsl-commute-board:latest
      TF_VAR_digitransit_subscription_key: ${{ secrets.DIGITRANSIT_SUBSCRIPTION_KEY }}
      TF_VAR_alert_email: ${{ vars.AZURE_ALERT_EMAIL }}
      TF_IN_AUTOMATION: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialize Terraform with Azure Blob state
        run: >-
          terraform -chdir=infra/terraform init
          -backend-config="resource_group_name=${{ vars.AZURE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=timetables.tfstate"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"
      - name: Apply Terraform
        run: terraform -chdir=infra/terraform apply -auto-approve

      - name: Report application URL
        run: terraform -chdir=infra/terraform output -raw app_url
